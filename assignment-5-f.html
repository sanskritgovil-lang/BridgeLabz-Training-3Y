<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Photo Gallery</title>
    <style>
        body { padding: 2rem; background-color: #eaeaea; font-family: sans-serif; }
        
        /* Grid Layout */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        /* Image Container */
        .gallery-item {
            position: relative;
            overflow: hidden;
            border-radius: 12px; /* Box-model requirement */
            box-shadow: 0 6px 12px rgba(0,0,0,0.15); /* Box-shadow requirement */
        }

        /* Image Scaling */
        .gallery-item img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.1);
        }

        /* Caption Overlay */
        .caption {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 15px;
            text-align: center;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .gallery-item:hover .caption {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="gallery">
        <div class="gallery-item">
            <img src="https://via.placeholder.com/400x300" alt="Image 1">
            <div class="caption">Beautiful Landscape</div>
        </div>
        <div class="gallery-item">
            <img src="https://via.placeholder.com/400x300" alt="Image 2">
            <div class="caption">City Skyline</div>
        </div>
        <div class="gallery-item">
            <img src="https://via.placeholder.com/400x300" alt="Image 3">
            <div class="caption">Ocean Waves</div>
        </div>
        <div class="gallery-item">
            <img src="https://via.placeholder.com/400x300" alt="Image 4">
            <div class="caption">Mountain Peak</div>
        </div>
        <div class="gallery-item">
            <img src="https://via.placeholder.com/400x300" alt="Image 5">
            <div class="caption">Forest Trail</div>
        </div>
        <div class="gallery-item">
            <img src="https://via.placeholder.com/400x300" alt="Image 6">
            <div class="caption">Desert Dunes</div>
        </div>
    </div>
</body>
</html>
