<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 5 - Styled Button Collection</title>
    <!-- Link to the separate external CSS stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Semantic Header element -->
    <header>
        <h1>Styled Button Collection</h1>
        <p>Demonstrating various button styles, states, and pseudo-classes.</p>
    </header>

    <!-- Semantic Main content element -->
    <main>
        <!-- Container aligning buttons neatly using Flexbox -->
        <section class="button-container">
            
            <!-- Primary Button Style -->
            <button class="btn primary-btn">Primary Button</button>

            <!-- Secondary Button Style -->
            <button class="btn secondary-btn">Secondary Button</button>

            <!-- Outline Button Style -->
            <button class="btn outline-btn">Outline Button</button>

            <!-- Disabled Button Style (:disabled state) -->
            <button class="btn disabled-btn" disabled>Disabled Button</button>

        </section>
    </main>

    <!-- Semantic Footer element -->
    <footer>
        <p>&copy; 2026 Web Design Assignment - Question 5</p>
    </footer>

</body>
</html>
