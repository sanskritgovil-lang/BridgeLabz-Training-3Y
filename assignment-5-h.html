<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        
        body { display: flex; flex-direction: column; height: 100vh; background-color: #ecf0f1; }

        /* Fixed Header */
        header {
            position: fixed;
            top: 0; width: 100%;
            background-color: #2c3e50;
            color: white;
            padding: 1rem 2rem;
            z-index: 1000;
        }

        /* Layout Structure */
        .wrapper {
            display: flex;
            margin-top: 60px; /* Space for fixed header */
            flex: 1;
        }

        /* Sidebar */
        aside {
            width: 250px;
            background-color: #34495e;
            color: white;
            padding: 2rem 1rem;
            min-height: calc(100vh - 60px);
        }

        aside a { display: block; color: white; text-decoration: none; padding: 10px; margin-bottom: 5px; }
        aside a:hover { background-color: #2c3e50; }

        /* Main Content */
        main {
            flex: 1;
            padding: 2rem;
            display: flex;
            gap: 20px;
            align-content: flex-start;
        }

        .content-box {
            flex: 1;
            background: white;
            padding: 2rem;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            border-radius: 8px;
            height: 200px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .wrapper { flex-direction: column; }
            aside { width: 100%; min-height: auto; }
            main { flex-direction: column; }
        }
    </style>
</head>
<body>
    <header><h2>Admin Dashboard</h2></header>
    <div class="wrapper">
        <aside>
            <a href="#">Dashboard</a>
            <a href="#">Users</a>
            <a href="#">Settings</a>
        </aside>
        <main>
            <div class="content-box"><h3>Statistics</h3></div>
            <div class="content-box"><h3>Recent Activity</h3></div>
        </main>
    </div>
</body>
</html>
