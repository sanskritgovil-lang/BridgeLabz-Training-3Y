<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 6 - CSS Animation Demonstration</title>
    <!-- Link to the separate external CSS stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Semantic Header element -->
    <header>
        <h1>CSS Animation Demonstration</h1>
        <p>Showcasing keyframe animations, delays, loops, and directions.</p>
    </header>

    <!-- Semantic Main content element -->
    <main>
        <!-- Centered animation container -->
        <section class="animation-container">
            
            <!-- Animated Element 1: Moving Box -->
            <div class="animated-box" title="Moving Box"></div>

            <!-- Animated Element 2: Bouncing Ball -->
            <div class="animated-ball" title="Bouncing Ball"></div>

            <!-- Animated Element 3: Color-Changing Text -->
            <div class="animated-text">Pulsing & Color-Changing Text</div>

        </section>
    </main>

    <!-- Semantic Footer element -->
    <footer>
        <p>&copy; 2026 Web Design Assignment - Question 6</p>
    </footer>

</body>
</html>
