<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 3 - Image Showcase Layout</title>
    <!-- Link to the separate external CSS stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Semantic Header element -->
    <header>
        <h1>Image Showcase Layout</h1>
        <p>A responsive gallery of six images with modern hover effects and captions.</p>
    </header>

    <!-- Semantic Main content element -->
    <main>
        <!-- Showcase Container using CSS Grid -->
        <section class="showcase-grid">
            
            <!-- Image 1 -->
            <figure class="showcase-item">
                <img src="https://picsum.photos/id/1015/400/300" alt="Nature landscape view">
                <figcaption>Mountain River</figcaption>
            </figure>

            <!-- Image 2 -->
            <figure class="showcase-item">
                <img src="https://picsum.photos/id/1025/400/300" alt="Cute puppy dog">
                <figcaption>Loyal Companion</figcaption>
            </figure>

            <!-- Image 3 -->
            <figure class="showcase-item">
                <img src="https://picsum.photos/id/1035/400/300" alt="Ancient architecture building">
                <figcaption>Historic Architecture</figcaption>
            </figure>

            <!-- Image 4 -->
            <figure class="showcase-item">
                <img src="https://picsum.photos/id/1045/400/300" alt="Ocean waves on a beach">
                <figcaption>Ocean Sunset</figcaption>
            </figure>

            <!-- Image 5 -->
            <figure class="showcase-item">
                <img src="https://picsum.photos/id/1055/400/300" alt="Forest trees and sunlight">
                <figcaption>Misty Forest</figcaption>
            </figure>

            <!-- Image 6 -->
            <figure class="showcase-item">
                <img src="https://picsum.photos/id/1065/400/300" alt="City skyline at night">
                <figcaption>Urban Skyline</figcaption>
            </figure>

        </section>
    </main>

    <!-- Semantic Footer element -->
    <footer>
        <p>&copy; 2026 Web Design Assignment - Question 3</p>
    </footer>

</body>
</html>
