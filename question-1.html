<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Filter Gallery</title>
    <!-- Link to the separate external CSS stylesheet -->
    <link rel="stylesheet" href="image-filter-gallery.css">
</head>
<body>

    <!-- Semantic Header element -->
    <header>
        <h1>Responsive Image Filter Gallery</h1>
        <p>Hover over any image to remove its CSS filter effect smoothly.</p>
    </header>

    <!-- Semantic Main content element -->
    <main>
        <!-- Grid container displaying six images -->
        <section class="gallery-grid">
            
            <!-- Image 1: Blur Filter -->
            <figure class="gallery-item">
                <img src="https://picsum.photos/id/1015/400/300" alt="Landscape with river and mountains" class="filter-blur">
                <figcaption>Blur Filter</figcaption>
            </figure>

            <!-- Image 2: Grayscale Filter -->
            <figure class="gallery-item">
                <img src="https://picsum.photos/id/1025/400/300" alt="Cute puppy" class="filter-grayscale">
                <figcaption>Grayscale Filter</figcaption>
            </figure>

            <!-- Image 3: Sepia Filter -->
            <figure class="gallery-item">
                <img src="https://picsum.photos/id/1035/400/300" alt="Historic building architecture" class="filter-sepia">
                <figcaption>Sepia Filter</figcaption>
            </figure>

            <!-- Image 4: Brightness Filter -->
            <figure class="gallery-item">
                <img src="https://picsum.photos/id/1045/400/300" alt="Ocean sunset view" class="filter-brightness">
                <figcaption>Brightness Filter</figcaption>
            </figure>

            <!-- Image 5: Contrast Filter -->
            <figure class="gallery-item">
                <img src="https://picsum.photos/id/1055/400/300" alt="Misty forest trees" class="filter-contrast">
                <figcaption>Contrast Filter</figcaption>
            </figure>

            <!-- Image 6: Hue-Rotate Filter -->
            <figure class="gallery-item">
                <img src="https://picsum.photos/id/1065/400/300" alt="City skyline at night" class="filter-hue">
                <figcaption>Hue-Rotate Filter</figcaption>
            </figure>

        </section>
    </main>

    <!-- Semantic Footer element -->
    <footer>
        <p>&copy; 2026 Responsive Web Design Assignment - Question 1</p>
    </footer>

</body>
</html>
