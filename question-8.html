<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Comparison Layout</title>
    <link rel="stylesheet" href="filter-comparison-layout.css">
</head>
<body>
    <header class="site-header">
        <h1>Filter Comparison Layout</h1>
        <p>Hover over the right image to remove the brightness filter smoothly.</p>
    </header>
    <main class="main-content">
        <section class="comparison-container">
            <figure class="image-card">
                <img src="https://picsum.photos/id/1043/400/300" alt="Original landscape">
                <figcaption>Original Image (Unfiltered)</figcaption>
            </figure>
            <figure class="image-card">
                <img src="https://picsum.photos/id/1043/400/300" alt="Filtered landscape" class="filtered-image">
                <figcaption>Filtered Image (Brightness Applied)</figcaption>
            </figure>
        </section>
    </main>
    <footer class="site-footer">
        <p>&copy; 2026 Web Design Assignment - Question 8</p>
    </footer>
</body>
</html>
