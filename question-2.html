<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 2 - Tooltip Demonstration</title>
    <!-- Link to the separate external CSS stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Semantic Header element -->
    <header>
        <h1>CSS Tooltip Demonstration</h1>
        <p>Hover over the elements below to view pure CSS tooltips.</p>
    </header>

    <!-- Semantic Main content element -->
    <main>
        <!-- Flexbox container centering the examples -->
        <section class="tooltip-container">
            
            <!-- Tooltip Example 1: Word element -->
            <div class="tooltip-wrapper">
                <span class="target-element">Hover Word</span>
                <div class="tooltip-box">This is a smooth CSS tooltip!</div>
            </div>

            <!-- Tooltip Example 2: Icon element -->
            <div class="tooltip-wrapper">
                <span class="target-element icon-badge">ℹ️ Info Icon</span>
                <div class="tooltip-box">Information details displayed above.</div>
            </div>

            <!-- Tooltip Example 3: Button element -->
            <div class="tooltip-wrapper">
                <button class="target-button">Hover Button</button>
                <div class="tooltip-box">Action helper text description.</div>
            </div>

        </section>
    </main>

    <!-- Semantic Footer element -->
    <footer>
        <p>&copy; 2026 Web Design Assignment - Question 2</p>
    </footer>

</body>
</html>
